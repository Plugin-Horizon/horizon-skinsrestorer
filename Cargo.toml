[package]
name = "mod-skinsrestorer"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Only for the title's JSON text (crates already in Horizon's Cargo.lock, as the core uses serde_json too).
serde_json = "1"
base64 = "0.22"
# gzip of the skins menu (openGUI); in Horizon's Cargo.lock already.
flate2 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
log = "0.4"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"], optional = true }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }


[features]
# Registers the `skinsrestorer` expansion with the placeholderapi mod (needs it as a dependency of the bundle, as deluxemenus does).
placeholderapi = []
default = ["mysql", "net"]
mysql = ["dep:mysql"]
# /sr status and /sr dump (HTTP).
net = ["dep:ureq"]
